name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      lambdaRuntime:
        type: choice
        description: 'Lambda Runtime'
        required: true
        default: 'jvm'
        options:
          - jvm
          - native

jobs:
  build:
    # For pushes to master, deploy.yml runs the tests as part of the deploy build,
    # so only run tests here when the deploy is being skipped ([release] or [skip deploy]).
    # PRs and manual dispatches always run tests.
    if: "github.event_name != 'push' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[skip deploy]')"
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 21
          cache: 'maven'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget scour ghostscript fuse
      - name: Install image magick
        uses: mfinelli/setup-imagemagick@v6
        with:
          cache: true
          install-libfuse2: true
      - name: Test dependencies
        run: |
          magick -version
          scour --version

      # Test entire project
      - name: Maven build
        timeout-minutes: 30
        run: make action-test-${{ github.event.inputs.lambdaRuntime || 'jvm' }}
